name: test

on:
  # run tests on push to master, but not when other branches are pushed to
  push:
    branches: [master]
  # run tests for all pull requests
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# cancel superseded runs of the same branch / pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # minimum version from go.mod and the latest stable release
        go: [go.mod, stable]

    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check go.mod/go.sum are tidy
        run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
