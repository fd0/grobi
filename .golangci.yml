# This is the configuration for golangci-lint (v2).
#
# A sample config with all settings is here:
# https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  # only enable the linters listed below
  default: none
  enable:
    # make sure all errors returned by functions are handled
    - errcheck

    # examine code and report suspicious constructs, such as Printf calls whose
    # arguments do not align with the format string
    - govet

    # make sure names and comments are used according to the conventions
    # (successor of golint)
    - revive

    # detect when assignments to existing variables are not used
    - ineffassign

    # run static analysis and find errors (includes gosimple)
    - staticcheck

    # find unused code, variables, functions, structs, fields, etc.
    # (replaces deadcode, structcheck, varcheck)
    - unused

  exclusions:
    rules:
      # revive: do not warn about missing comments for exported stuff
      - linters: [revive]
        text: "exported (function|method|var|type|const) .* should have comment"
      # revive: ignore constants in all caps
      - linters: [revive]
        text: "don't use ALL_CAPS in Go names; use CamelCase"

formatters:
  enable:
    # make sure code is formatted
    - gofmt
